<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Salami</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- STEP 1 -->
  <div class="card active" id="step1">
    <img src="images/1.jpg">
    <button onclick="next(2)">Next ➡</button>
  </div>

  <!-- STEP 2 -->
  <div class="card" id="step2">
    <img src="images/2.jpg">
    <button onclick="next(3)">Click to see ARNOB'S Message</button>
  </div>

  <!-- STEP 3 -->
  <div class="card" id="step3">
    <img src="images/msg.jpg">
    <button onclick="next(4)">Next</button>
  </div>

  <!-- STEP 4 -->
  <div class="card" id="step4">
    <h2>✨ EID SALAMI ✨</h2>
    <input type="text" id="name" placeholder="Enter your name">
    <button onclick="startGame()">Start</button>
  </div>

  <!-- STEP 5 -->
  <div class="card" id="step5">
    <canvas id="wheel"></canvas>
    <button onclick="spin()">SPIN</button>
    <p id="result"></p>
    <button id="claimBtn" style="display:none;">Claim Salami</button>
  </div>

</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</body>
</html>
