<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Salami</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="style.css">

<style>
/* Basic resets */
body { margin:0; padding:0; background:#000; color:#fff; font-family:sans-serif; }
.container { max-width:500px; margin:20px auto; text-align:center; }
.card { display:none; margin-bottom:20px; }
.card.active { display:block; }

/* Front page content */
.dev-text, .devBox { margin-top:10px; }
.dev-text a, .devBox a { text-decoration:none; color: #ffff00; font-weight:bold; position:relative; }
.devBox a::after {
    content:""; 
    position:absolute; left:0; bottom:-2px; width:100%; height:3px; 
    background: linear-gradient(90deg, red, yellow, green, cyan); 
    animation: neonGlow 1.5s linear infinite;
}
@keyframes neonGlow {
  0%{opacity:0.5;} 50%{opacity:1;} 100%{opacity:0.5;}
}

/* Buttons */
button { background:#ff00ff; border:none; padding:10px 20px; color:#fff; border-radius:6px; cursor:pointer; font-size:16px; margin-top:10px; }
button:hover { background:#ff33ff; }

/* Images */
img { max-width:100%; height:auto; border-radius:8px; margin-top:10px; }

/* Spinner styles */
#wheel { margin:20px auto; display:block; }

/* Screenshot text */
.shot { display:none; margin-top:10px; font-weight:bold; }
</style>

</head>
<body>

<div class="container">

  <!-- STEP 1 (Front Page) -->
  <div id="step1" class="card active">
    <img src="images/1.jpg" alt="Step 1 Image">
    <button onclick="next(2)">Next ➡</button>
    <div class="dev-text">
      Developed by <a href="developer.html" class="arnob-link">ARNOB</a>
    </div>
  </div>

  <!-- STEP 2 (Greeting Image) -->
  <div id="step2" class="card">
    <img src="images/2.jpg" alt="Step 2 Greeting">
    <button onclick="next(3)">Click to see ARNOB'S Message</button>
  </div>

  <!-- STEP 3 (Wish Image) -->
  <div id="step3" class="card">
    <img src="images/msg.jpg" alt="Step 3 Wish">
    <button onclick="next(4)">Next</button>
  </div>

  <!-- STEP 4 (Name Input) -->
  <div id="step4" class="card">
    <h4>✨ EID SALAMI ✨</h4>
    <input type="text" id="name" placeholder="Enter your Real Name" required>
    <button onclick="startGame()">Start</button>
  </div>

  <!-- STEP 5 (Spinner) -->
  <div id="step5" class="card">
    <img src="images/eid-mubarak.jpg" class="eid-mubarak" alt="Eid Mubarak">

    <h2 class="title">EID SALAMI SPINNER-2026</h2>

    <div class="devBox">
      <h3 class="dev">Developed by</h3>
      <a href="developer.html" class="arnob">ARNOB</a>
    </div>

    <!-- Spinner Pointer -->
    <div class="pointer" style="width:0; height:0; border-left:15px solid transparent; border-right:15px solid transparent; border-bottom:30px solid red; margin:10px auto;"></div>

    <!-- Spinner Wheel -->
    <canvas id="wheel" width="300" height="300"></canvas>

    <!-- Spin Button -->
    <button onclick="spinWheel()">SPIN</button>

    <!-- Result -->
    <p id="result"></p>

    <!-- Screenshot Text -->
    <p id="screenshotText" class="shot">Etar ekta screenshot nen 📸</p>

    <!-- Claim Button -->
    <button id="claimBtn">Claim Salami</button>
    <img id="claimImage" src="images/claim.jpg" alt="Claim Image">
  </div>

</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</body>
</html>
